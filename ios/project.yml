name: ScoreKeep
options:
  bundleIdPrefix: com.scorekeep
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

schemes:
  ScoreKeep:
    build:
      targets:
        ScoreKeep: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScoreKeepTests
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    INFOPLIST_KEY_UIStatusBarHidden: "YES"
    INFOPLIST_KEY_UIRequiresFullScreen: "YES"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    minorVersion: 13.1.0

targets:
  ScoreKeep:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScoreKeep
    resources:
      - path: ScoreKeep/Resources/Assets.xcassets
      - path: ScoreKeep/Resources/Fonts
    dependencies:
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorekeep.app
        INFOPLIST_FILE: ScoreKeep/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: |
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight

  ScoreKeepTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScoreKeepTests
    dependencies:
      - target: ScoreKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scorekeep.tests
        GENERATE_INFOPLIST_FILE: YES
